[package]
name = "secret-sense"
# Kept equal to `package.json`'s version.
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Guess whether a string is a secret (API key, token, credential) or plain configuration"
license = "MIT"
repository = "https://github.com/convex/secret-sense"
readme = "README.md"
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**/*.rs"]

[workspace]
# `wasm` holds the WebAssembly bindings for the npm package. It isn't published
# to crates.io, so the crate itself never depends on wasm-bindgen.
members = ["wasm"]

[profile.release]
# Only applies when building in this workspace (the npm package's WebAssembly);
# crates.io dependents use their own profiles.
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
