name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- --deny warnings
      - run: cargo test --locked --workspace
      - name: Check the minimum supported Rust version
        run: |
          msrv="$(sed -nE 's/^rust-version = "(.*)"$/\1/p' Cargo.toml)"
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --locked --package secret-sense
      - name: Check the published crate
        run: |
          cargo package --locked --package secret-sense
          cargo package --locked --package secret-sense --list

  npm:
    name: npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pnpm version from package.json's `packageManager`.
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `cargo install` skips the build when the cache already has this version.
      - name: Install wasm-bindgen
        run: cargo install --locked wasm-bindgen-cli --version "$(node scripts/build.mjs --print-wasm-bindgen-version)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Check the published package
        run: npm pack --dry-run

  release-notes:
    name: Versions and release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Installs the pnpm version from package.json's `packageManager`.
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Check that the crate and the npm package have the same version
        run: node scripts/sync-version.mjs --check
      - run: pnpm install --frozen-lockfile
      - name: Check the release notes when the version changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          version=$(jq -r .version package.json)
          previous=$(git show "$BASE_SHA:package.json" | jq -r .version)
          if [[ "$version" != "$previous" ]]; then
            git update-ref refs/heads/main HEAD
            pnpm changeset status --output "$RUNNER_TEMP/changesets.json"
            jq -e '.changesets | length == 0' "$RUNNER_TEMP/changesets.json"
            awk -v version="$version" '/^## / { active=($0 == "## " version); next } active && !/^#/ && /[[:alnum:]]/ { found=1 } END { exit !found }' CHANGELOG.md
          fi
