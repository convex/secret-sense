# Releases the `v<version>` tag: builds and tests it, stages the npm package
# for a maintainer to approve with 2FA, then publishes the crate to crates.io.
# Both registries authenticate with trusted publishing. See CONTRIBUTING.md.
name: Release

on:
  push:
    tags: ["v*"]
  # Started on a tag by the version workflow, or by hand to retry a tag.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24.22.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      name: ${{ steps.release.outputs.name }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      artifact_id: ${{ steps.pack.outputs.artifact-id }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Installs the pnpm version from package.json's `packageManager`.
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - id: release
        uses: convex/npm-release-actions/validate-tag@3a142e21f421319890981579b8952267bc11fc53 # v0.3.0
      - name: Check that the crate has the same version
        run: node scripts/sync-version.mjs --check
      - run: pnpm install --frozen-lockfile
      - uses: convex/npm-release-actions/check-release-notes@3a142e21f421319890981579b8952267bc11fc53 # v0.3.0
      # No build cache here, so that nothing from other runs reaches the
      # published packages.
      - run: rustup toolchain install
      - name: Install wasm-bindgen
        run: cargo install --locked wasm-bindgen-cli --version "$(node scripts/build.mjs --print-wasm-bindgen-version)"
      - run: cargo test --locked --workspace
      - run: cargo package --locked --package secret-sense
      - run: pnpm build
      - run: pnpm test
      - id: pack
        uses: convex/npm-release-actions/pack@3a142e21f421319890981579b8952267bc11fc53 # v0.3.0

  stage-npm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The npm trusted publisher only accepts jobs in this environment.
    environment: release-npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: convex/npm-release-actions/stage@3a142e21f421319890981579b8952267bc11fc53 # v0.3.0
        with:
          artifact-id: ${{ needs.build.outputs.artifact_id }}
          sha256: ${{ needs.build.outputs.sha256 }}
          name: ${{ needs.build.outputs.name }}
          version: ${{ needs.build.outputs.version }}
          channel: ${{ needs.build.outputs.channel }}
          node-version: ${{ env.NODE_VERSION }}

  publish-crate:
    # After staging, so that a failure on either side stops before anything is
    # public. The crate is published right away, while the npm package waits
    # for approval: add required reviewers to the `release-rust` environment
    # to gate this job too.
    needs: [build, stage-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The crates.io trusted publisher only accepts jobs in this environment.
    environment: release-rust
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # The build job already built and tested this commit's package with
      # `cargo package`. Skipping the rebuild here means no build scripts or
      # proc macros run while the crates.io token is in the environment.
      - run: cargo publish --locked --no-verify --package secret-sense
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
